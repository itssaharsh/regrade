name: pages
# production moved to Vercel (https://regrade-app.vercel.app); the old Pages URL now redirects there, keeping the query string
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Build the redirect page
        run: |
          mkdir -p out
          cat > out/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Regrade has moved</title><meta http-equiv="refresh" content="0; url=https://regrade-app.vercel.app/">
          <link rel="canonical" href="https://regrade-app.vercel.app/">
          <script>location.replace('https://regrade-app.vercel.app/' + location.search + location.hash)</script></head>
          <body style="font:16px/1.5 system-ui,sans-serif;max-width:36rem;margin:15vh auto;padding:0 16px">
          <p>Regrade has moved to <a href="https://regrade-app.vercel.app/">regrade-app.vercel.app</a>.</p></body></html>
          HTML
          cp out/index.html out/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: out }
      - id: deployment
        uses: actions/deploy-pages@v4
